<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>3D Baseball Duel - 9 Pitches Ultimate</title>
    <style>
        body {
            margin: 0; overflow: hidden; background-color: #0b0f19;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; user-select: none;
        }
        #canvas-container {
            width: 100%; height: 600px; position: relative;
        }
        #minimal-controls {
            position: absolute; top: 15px; left: 15px;
            display: flex; align-items: center; gap: 8px; z-index: 110;
        }
        .round-btn {
            width: 42px; height: 42px; border-radius: 50%;
            background: rgba(15, 23, 42, 0.95); border: 2px solid #38bdf8;
            color: #38bdf8; font-size: 18px; cursor: pointer;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3); transition: all 0.2s; outline: none;
        }
        .round-btn:hover { background: #38bdf8; color: #020617; transform: scale(1.1); }
        .play-btn-mini { 
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff; border: 2px solid #10b981;
            padding: 8px 18px; font-size: 13px; font-weight: bold; border-radius: 20px;
            cursor: pointer; box-shadow: 0 4px 12px rgba(16,185,129,0.4);
        }
        .swing-btn { 
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: #fff; border: 2px solid #facc15;
            padding: 8px 18px; font-size: 13px; font-weight: bold; border-radius: 20px;
            cursor: pointer; box-shadow: 0 4px 12px rgba(239,68,68,0.4);
        }
        #gui-popup { 
            position: absolute; top: 70px; left: 15px;
            background: rgba(15, 23, 42, 0.95); padding: 15px;
            border-radius: 12px; border: 2px solid #38bdf8;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); color: #fff;
            z-index: 120; width: 300px; max-height: 480px; overflow-y: auto; display: none;
        }
        .btn {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: #fff; border: 1px solid #475569; padding: 6px 10px;
            font-size: 11px; font-weight: bold; border-radius: 6px;
            cursor: pointer; margin-right: 4px; margin-bottom: 6px;
            display: inline-block; transition: all 0.2s;
        }
        .btn:hover { background: #38bdf8; border-color: #38bdf8; color: #0f172a; }
        .btn-active {
            border: 2px solid #f59e0b !important;
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.6);
            background: linear-gradient(135deg, #d97706, #b45309) !important;
        }
        .section-title { 
            font-size: 11px; font-weight: bold; color: #facc15;
            margin: 10px 0 6px 0; border-bottom: 1px solid #334155;
            padding-bottom: 4px; text-transform: uppercase; letter-spacing: 0.8px;
        }
        #bso-board {
            position: absolute; top: 15px; right: 15px;
            background: rgba(15, 23, 42, 0.95); border: 2px solid #facc15;
            border-radius: 10px; padding: 12px 16px; color: #fff;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8); z-index: 100;
            min-width: 200px; font-family: monospace;
        }
        .bso-row { display: flex; align-items: center; margin-bottom: 6px; font-weight: bold; font-size: 16px; }
        .bso-label { width: 30px; font-weight: 900; }
        .bso-dots { display: flex; gap: 8px; }
        .dot-lamp {
            width: 15px; height: 15px; border-radius: 50%;
            background-color: #1e293b; border: 1.5px solid #0f172a;
        }
        .dot-ball.lit { background-color: #38bdf8; box-shadow: 0 0 12px #38bdf8; }
        .dot-strike.lit { background-color: #fbbf24; box-shadow: 0 0 12px #fbbf24; }
        .dot-out.lit { background-color: #ef4444; box-shadow: 0 0 12px #ef4444; }
        #score-display {
            border-top: 1px solid #334155; margin-top: 8px;
            padding-top: 8px; font-size: 12px; color: #cbd5e1; line-height: 1.5;
        }
        #cyber-speedgun {
            position: absolute; bottom: 20px; right: 20px;
            background: rgba(15, 23, 42, 0.95); border: 2px solid #38bdf8;
            border-radius: 12px; padding: 12px 20px; color: #fff;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.2);
            min-width: 220px; font-family: monospace; z-index: 100; display: none;
        }
        .gun-title { font-size: 11px; color: #94a3b8; border-bottom: 1px solid #334155; padding-bottom: 4px; margin-bottom: 6px; }
        .gun-value { font-size: 24px; font-weight: bold; color: #10b981; text-shadow: 0 0 10px rgba(16,185,129,0.3); }
        #judge-overlay { 
            position: absolute; top: 35%; left: 50%; transform: translate(-50%, -50%) scale(0.5);
            font-size: 46px; font-weight: 900; color: #ef4444; text-shadow: 0 0 20px rgba(239,68,68,0.5), 0 0 40px #000;
            z-index: 150; pointer-events: none; opacity: 0;
            transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275); text-align: center;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
    <div id="canvas-container">
        <div id="minimal-controls">
            <button class="round-btn" id="menuToggleBtn" title="メニュー開閉">⚙</button>
            <button class="play-btn-mini" id="playBtn">▶ 投球 (Enter)</button>
            <button class="swing-btn" id="swingBtn">🏏 スイング (Space)</button>
            <button class="btn" id="resetBtn" style="margin:0; padding:10px 16px; border-radius:20px; background:#334155; border-color:#475569;">リセット</button>
        </div>

        <div id="bso-board">
            <div class="bso-row">
                <span class="bso-label" style="color:#38bdf8;">B</span>
                <div class="bso-dots">
                    <div class="dot-lamp dot-ball" id="b1"></div>
                    <div class="dot-lamp dot-ball" id="b2"></div>
                    <div class="dot-lamp dot-ball" id="b3"></div>
                </div>
            </div>
            <div class="bso-row">
                <span class="bso-label" style="color:#fbbf24;">S</span>
                <div class="bso-dots">
                    <div class="dot-lamp dot-strike" id="s1"></div>
                    <div class="dot-lamp dot-strike" id="s2"></div>
                </div>
            </div>
            <div class="bso-row">
                <span class="bso-label" style="color:#ef4444;">O</span>
                <div class="bso-dots">
                    <div class="dot-lamp dot-out" id="o1"></div>
                    <div class="dot-lamp dot-out" id="o2"></div>
                </div>
            </div>
            <div id="score-display">
                モード: <span id="game-mode-label" style="color:#f59e0b; font-weight:bold;">🔍 練習モード</span><br>
                得点: <span id="score-val" style="color:#10b981; font-weight:bold;">0</span> | 走者: <span id="runners-val" style="color:#a78bfa;">なし</span><br>
                HR: <span id="hr-val" style="color:#f43f5e; font-weight:bold;">0</span> | 三振: <span id="k-val" style="color:#3b82f6; font-weight:bold;">0</span>
            </div>
        </div>

        <div id="gui-popup">
            <div class="section-title" style="margin-top:0;">対戦・練習選択</div>
            <div style="margin-bottom: 6px; display:flex; flex-direction:column; gap:4px;">
                <button class="btn btn-view btn-active" id="gameModePractice">🔍 練習・解析モード</button>
                <button class="btn btn-view" id="gameModeBatter">🏏 打者対戦モード</button>
            </div>

            <div class="section-title">見極めアシスト</div>
            <div style="margin-bottom: 8px; font-size:11px;">
                <label style="cursor:pointer; display:flex; align-items:center; gap:6px;">
                    <input type="checkbox" id="assistSlowCheck" checked> ⏱️ スローモーション (0.3倍速) 有効
                </label> 
            </div>

            <div id="pitch-selection-block">
                <div class="section-title">投手選択 (左投げ全9球種)</div>
                <div style="margin-bottom: 6px;">
                    <button class="btn btn-view btn-active" id="modeAll">全球種同時</button>
                    <button class="btn btn-view" id="modeStraight">1. ストレート</button>
                    <button class="btn btn-view" id="modeTwoSeam">2. ツーシーム</button>
                    <button class="btn btn-view" id="modeSlider">3. スライダー</button>
                    <button class="btn btn-view" id="modeCut">4. カット</button>
                    <button class="btn btn-view" id="modeCurve">5. カーブ</button>
                    <button class="btn btn-view" id="modeFork">6. フォーク</button>
                    <button class="btn btn-view" id="modeChangeup">7. チェンジ</button>
                    <button class="btn btn-view" id="modeSinker">8. シンカー</button>
                    <button class="btn btn-view" id="modeShoot">9. シュート</button>
                </div>
            </div>

            <div class="section-title">アングル切り替え</div>
            <div style="margin-bottom: 6px;">
                <button class="btn btn-view" id="viewCatcher">👀 キャッチャー目線</button>
                <button class="btn btn-view" id="viewSide">👀 一塁側</button>
                <button class="btn btn-view btn-active" id="viewBack">👀 投手背後</button>
            </div>
        </div>

        <div id="cyber-speedgun">
            <div class="gun-title" id="gun-pitch-name">SPEED ANALYZER</div>
            <div class="gun-value" id="gun-speed">--- km/h</div>
            <div style="font-size:11px; margin-top:4px; color:#a5f3fc;" id="gun-rpm">SPIN: --- rpm</div>
            <div style="font-size:11px; margin-top:2px; color:#34d399;" id="gun-break">MAX BREAK: --- cm</div>
        </div>

        <div id="judge-overlay">PLAYBALL!</div>
    </div>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f172a);

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / 600, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, 600);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        const cameraPresets = { 
            catcher: { pos: new THREE.Vector3(0, 1.35, 3.8), target: new THREE.Vector3(0, 0.9, -18.44) },
            side: { pos: new THREE.Vector3(14, 2.0, -9.2), target: new THREE.Vector3(0, 1.0, -9.2) },
            back: { pos: new THREE.Vector3(0, 2.5, -23.5), target: new THREE.Vector3(0, 1.0, 0) }
        };

        function setCameraPreset(key) { 
            const preset = cameraPresets[key];
            camera.position.copy(preset.pos);
            controls.target.copy(preset.target);
            controls.update();
        }
        setCameraPreset('back');

        const ambLight = new THREE.AmbientLight(0xffffff, 0.55);
        scene.add(ambLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
        dirLight.position.set(10, 35, -5);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const turfGeo = new THREE.PlaneGeometry(220, 220);
        const turfMat = new THREE.MeshStandardMaterial({ color: 0x1b5e20, roughness: 0.85 });
        const turf = new THREE.Mesh(turfGeo, turfMat); 
        turf.rotation.x = -Math.PI / 2;
        scene.add(turf);

        const dirtGeo = new THREE.CircleGeometry(26, 32); 
        const dirtMat = new THREE.MeshStandardMaterial({ color: 0x795548, roughness: 0.9 });
        const dirt = new THREE.Mesh(dirtGeo, dirtMat);
        dirt.rotation.x = -Math.PI / 2;
        dirt.position.set(0, 0.01, -10);
        scene.add(dirt);

        const moundGeo = new THREE.CylinderGeometry(2.4, 2.7, 0.22, 32);
        const mound = new THREE.Mesh(moundGeo, dirtMat);
        mound.position.set(0, 0.1, -18.44); 
        scene.add(mound);

        const homeBase = new THREE.Mesh(new THREE.BoxGeometry(0.43, 0.01, 0.43), new THREE.MeshBasicMaterial({ color: 0xffffff }));
        homeBase.position.set(0, 0.02, 0.25); 
        scene.add(homeBase);

        const pitcherPlate = new THREE.Mesh(new THREE.BoxGeometry(0.61, 0.02, 0.15), new THREE.MeshBasicMaterial({ color: 0xffffff }));
        pitcherPlate.position.set(0, 0.21, -18.44); 
        scene.add(pitcherPlate);

        const fenceGeo = new THREE.CylinderGeometry(110, 110, 6.0, 64, 1, true, Math.PI * 0.72, Math.PI * 0.56);
        const fenceMat = new THREE.MeshLambertMaterial({ color: 0x0f172a, side: THREE.DoubleSide });
        const fence = new THREE.Mesh(fenceGeo, fenceMat);
        fence.position.set(0, 3.0, 0);
        scene.add(fence);

        const mitt = new THREE.Mesh(new THREE.SphereGeometry(0.16, 16, 16), new THREE.MeshStandardMaterial({ color: 0xd97706 }));
        mitt.position.set(0, 0.75, 0.5);
        scene.add(mitt);

        const uniformWhite = new THREE.MeshStandardMaterial({ color: 0xfafafa, roughness: 0.6 });
        const uniformNavy = new THREE.MeshStandardMaterial({ color: 0x0a142c, roughness: 0.5 });
        const skinMat = new THREE.MeshStandardMaterial({ color: 0xffdbac, roughness: 0.7 });
        const gloveMat = new THREE.MeshStandardMaterial({ color: 0x5c4033, roughness: 0.8 });
        const cleatMat = new THREE.MeshStandardMaterial({ color: 0x111111 });

        function createPlayerModel(isLeftHandedPitcher = false) {
            const group = new THREE.Group();
            const chest = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.12, 0.35, 6), uniformWhite);
            chest.position.y = 0.95;
            group.add(chest);
            const stripe = new THREE.Mesh(new THREE.CylinderGeometry(0.165, 0.155, 0.1, 6), uniformNavy);
            stripe.position.y = 1.0;
            group.add(stripe);
            const hip = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.13, 0.2, 6), uniformWhite);
            hip.position.y = 0.75;
            group.add(hip);
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.18, 0.18), skinMat);
            head.position.y = 1.25;
            group.add(head);
            const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.06, 8), uniformNavy);
            cap.position.set(0, 1.35, 0.01);
            group.add(cap);
            const visor = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.015, 0.12), uniformNavy);
            visor.position.set(0, 1.33, isLeftHandedPitcher ? -0.1 : 0.1);
            group.add(visor);

            const lLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.05, 0.35, 5), uniformWhite);
            lLeg.position.set(-0.07, 0.5, 0);
            const lFoot = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.06, 0.12), cleatMat);
            lFoot.position.set(-0.07, 0.3, isLeftHandedPitcher ? -0.02 : 0.02);
            group.add(lLeg, lFoot);

            const rLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.05, 0.35, 5), uniformWhite);
            rLeg.position.set(0.07, 0.5, 0);
            const rFoot = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.06, 0.12), cleatMat);
            rFoot.position.set(0.07, 0.3, isLeftHandedPitcher ? -0.02 : 0.02);
            group.add(rLeg, rFoot);

            const lArm = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.04, 0.32, 5), uniformWhite);
            lArm.position.set(-0.2, 0.95, 0);
            lArm.rotation.z = 0.2;
            const lHand = new THREE.Mesh(new THREE.SphereGeometry(0.04, 6, 6), isLeftHandedPitcher ? gloveMat : skinMat);
            lHand.position.set(-0.24, 0.78, 0);
            group.add(lArm, lHand);

            const rArm = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.04, 0.32, 5), uniformWhite);
            rArm.position.set(0.2, 0.95, 0);
            rArm.rotation.z = -0.2;
            const rHand = new THREE.Mesh(new THREE.SphereGeometry(0.04, 6, 6), isLeftHandedPitcher ? skinMat : gloveMat);
            rHand.position.set(0.24, 0.78, 0);
            group.add(rArm, rHand);

            return group;
        }

        const pitcherGroup = new THREE.Group();
        pitcherGroup.position.set(0, 0.1, -18.44);
        scene.add(pitcherGroup);

        const pitcherHuman = createPlayerModel(true);
        pitcherGroup.add(pitcherHuman);

        const pArm = new THREE.Group();
        pArm.position.set(-0.22, 1.0, 0); 
        pitcherGroup.add(pArm);
        const pHand = new THREE.Mesh(new THREE.SphereGeometry(0.05, 6, 6), skinMat);
        pHand.position.y = -0.38;
        pArm.add(pHand);

        const batterGroup = new THREE.Group();
        batterGroup.position.set(-0.7, 0.1, 0.1);
        scene.add(batterGroup);

        const batterHuman = createPlayerModel(false);
        batterGroup.add(batterHuman);

        const batPivot = new THREE.Group();
        batPivot.position.set(-0.15, 1.05, -0.15);
        batterGroup.add(batPivot);
        const bat = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.045, 0.95, 12), new THREE.MeshStandardMaterial({ color: 0xffaa00, metalness: 0.8, roughness: 0.2 }));
        bat.geometry.translate(0, 0.47, 0);
        bat.rotation.x = Math.PI / 2;
        batPivot.add(bat);

        const zonePoints = [ 
            new THREE.Vector3(-0.35, 0.4, 0.45), new THREE.Vector3(0.35, 0.4, 0.45),
            new THREE.Vector3(0.35, 0.4, 0.45), new THREE.Vector3(0.35, 1.3, 0.45),
            new THREE.Vector3(0.35, 1.3, 0.45), new THREE.Vector3(-0.35, 1.3, 0.45),
            new THREE.Vector3(-0.35, 1.3, 0.45), new THREE.Vector3(-0.35, 0.4, 0.45),
        ];
        const zoneLine = new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(zonePoints), new THREE.LineBasicMaterial({ color: 0xff3333, transparent:true, opacity:0.95 }));
        scene.add(zoneLine);

        const meetCursor = new THREE.Mesh(new THREE.RingGeometry(0.09, 0.11, 32), new THREE.MeshBasicMaterial({ color: 0xef4444, side: THREE.DoubleSide }));
        meetCursor.position.set(0, 0.85, 0.48); 
        scene.add(meetCursor);
        meetCursor.visible = false;

        const lockOn = new THREE.Mesh(new THREE.RingGeometry(0.12, 0.15, 32), new THREE.MeshBasicMaterial({ color: 0xf59e0b, side: THREE.DoubleSide }));
        lockOn.position.set(0, 0.85, 0.5);
        scene.add(lockOn);

        const timingRing = new THREE.Mesh(new THREE.RingGeometry(0.2, 0.23, 32), new THREE.MeshBasicMaterial({ color: 0x10b981, side: THREE.DoubleSide, transparent:true, opacity:0.8 }));
        timingRing.position.set(0, 0.85, 0.46); 
        scene.add(timingRing);

        const clickZone = new THREE.Mesh(new THREE.PlaneGeometry(2.5, 2.5), new THREE.MeshBasicMaterial({ visible: false }));
        clickZone.position.set(0, 0.85, 0.45);
        scene.add(clickZone);
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        // --- Full 9 Pitch Types Specification ---
        const pitches = {
            'ストレート':      { id: 1, color: 0xff3333, speed: 152, rpm: 2350, breakX: 0.0,   breakY: 0.0,   curveType: 'straight' },
            'ツーシーム':      { id: 2, color: 0xff7700, speed: 146, rpm: 2100, breakX: -0.15, breakY: -0.15, curveType: 'linear' },
            'スライダー':      { id: 3, color: 0x1e78fa, speed: 135, rpm: 1850, breakX: 0.65,  breakY: -0.1,  curveType: 'late' },
            'カットボール':    { id: 4, color: 0x00d2ff, speed: 142, rpm: 2000, breakX: 0.25,  breakY: -0.05, curveType: 'late' },
            'カーブ':          { id: 5, color: 0xffea00, speed: 116, rpm: 1250, breakX: 0.45,  breakY: -0.75, curveType: 'parabolic' },
            'フォーク':        { id: 6, color: 0x00f871, speed: 138, rpm: 880,  breakX: 0.0,   breakY: -0.85, curveType: 'drop' },
            'チェンジアップ':  { id: 7, color: 0x9900ff, speed: 126, rpm: 1400, breakX: -0.1,  breakY: -0.5,  curveType: 'late' },
            'シンカー':        { id: 8, color: 0xff00b4, speed: 130, rpm: 1650, breakX: -0.55, breakY: -0.45, curveType: 'late' },
            'シュート':        { id: 9, color: 0x76ff03, speed: 144, rpm: 1950, breakX: -0.35, breakY: -0.05, curveType: 'linear' }
        };

        const sparkCount = 30;
        const sparkGeo = new THREE.BufferGeometry();
        const sparkPositions = new Float32Array(sparkCount * 3);
        const sparkVels = [];
        for(let i=0; i<sparkCount; i++) {
            sparkVels.push(new THREE.Vector3((Math.random()-0.5)*10, (Math.random()-0.3)*10, (Math.random()-0.5)*12));
        }
        sparkGeo.setAttribute('position', new THREE.BufferAttribute(sparkPositions, 3));
        const sparkMat = new THREE.PointsMaterial({ size: 0.2, color: 0xffdd00, transparent: true, blending: THREE.AdditiveBlending });
        const sparkParticles = new THREE.Points(sparkGeo, sparkMat);
        scene.add(sparkParticles);
        sparkParticles.visible = false;

        let currentGameMode = 'practice';
        let isPlaying = false;
        let activeMode = 'all';
        let basePlaySpeed = 1.0;
        let currentPlaySpeed = 1.0;
        let userSelectedTarget = new THREE.Vector2(0, 0.85);

        let balls = 0, strikes = 0, outs = 0;
        let currentScore = 0, homerunCount = 0, strikeoutCount = 0;
        let bases = [false, false, false];

        // Support simultaneous multi-ball throwing structures
        const ballGroup = new THREE.Group();
        scene.add(ballGroup);

        const activeBalls = []; // List of active ball mesh wrapper objects
        const activeTrails = []; // Tube/Line meshes for visual paths

        function clearAllBalls() {
            activeBalls.forEach(b => ballGroup.remove(b.mesh));
            activeTrails.forEach(t => scene.remove(t));
            activeBalls.length = 0;
            activeTrails.length = 0;
        }

        let isHitBallActive = false;
        let hitT = 0;
        let hitStartPos = null;
        let hitTrailMesh = null;
        const hitTrailPoints = [];
        let activeHomerunParams = {};
        let hitStopTimer = 0;
        let currentHitSparkTime = 0;

        // Get dynamic coordinates considering variable flight timing by pitch speed
        function calcBallCoords(pName, animFrame, targetCourse) { 
            const releaseZ = -17.0;
            const targetZ = 0.5;
            const startX = -0.45; 
            const startY = 1.8;
            const tar = targetCourse || userSelectedTarget;
            
            if (animFrame < MOTION_END) {
                const ratio = animFrame / MOTION_END;
                return new THREE.Vector3(startX + 0.08 * ratio, startY + 0.12 * Math.sin(ratio * Math.PI), -18.44 + 1.44 * ratio);
            } else {
                const pSpec = pitches[pName];
                const speedRatio = pSpec.speed / 152.0; 
                const flightFrameRaw = (animFrame - MOTION_END) * speedRatio;
                const maxFlightFrames = TOTAL_FRAMES - MOTION_END;
                let t = Math.min(flightFrameRaw / maxFlightFrames, 1.0);

                let z = releaseZ + (targetZ - releaseZ) * t;
                let x = (1 - t) * startX + t * tar.x;
                let y = (1 - t) * startY + t * tar.y;

                const lateFactor = Math.pow(t, 2.5);
                const parabolicFactor = Math.sin(t * Math.PI);

                if (pSpec.curveType === 'late') {
                    x += pSpec.breakX * lateFactor;
                    y += pSpec.breakY * lateFactor;
                } else if (pSpec.curveType === 'parabolic') {
                    x += pSpec.breakX * t;
                    y += pSpec.breakY * t + 0.9 * parabolicFactor;
                } else if (pSpec.curveType === 'drop') {
                    x += pSpec.breakX * t;
                    y += pSpec.breakY * Math.pow(t, 3.0);
                } else if (pSpec.curveType === 'linear') {
                    x += pSpec.breakX * t;
                    y += pSpec.breakY * t;
                }
                return { pos: new THREE.Vector3(x, y, z), t: t };
            }
        }

        function updateBsoLights() {
            for (let i = 1; i <= 3; i++) {
                document.getElementById('b' + i).className = 'dot-lamp dot-ball' + (balls >= i ? ' lit' : '');
            }
            for (let i = 1; i <= 2; i++) {
                document.getElementById('s' + i).className = 'dot-lamp dot-strike' + (strikes >= i ? ' lit' : '');
                document.getElementById('o' + i).className = 'dot-lamp dot-out' + (outs >= i ? ' lit' : '');
            }
            document.getElementById('score-val').innerText = currentScore;
            document.getElementById('hr-val').innerText = homerunCount;
            document.getElementById('k-val').innerText = strikeoutCount;

            let baseText = [];
            if (bases[0]) baseText.push('一塁');
            if (bases[1]) baseText.push('二塁');
            if (bases[2]) baseText.push('三塁');
            document.getElementById('runners-val').innerText = baseText.length > 0 ? baseText.join('・') : 'なし';
        }

        function showJudgeOverlay(msg, colorStyle) {
            const overlay = document.getElementById('judge-overlay');
            overlay.innerHTML = msg;
            overlay.style.color = colorStyle;
            overlay.style.opacity = '1';
            overlay.style.transform = 'translate(-50%, -50%) scale(1.1)';
            setTimeout(() => { gsap.to(overlay, { opacity: 0, scale: 0.5, duration: 0.3 }); }, 2000); 
        }

        function advanceRunners(byBases) {
            let scoreThisPlay = 0;
            for (let b = 0; b < byBases; b++) {
                if (bases[2]) { scoreThisPlay++; bases[2] = false; } 
                if (bases[1]) { bases[2] = true; bases[1] = false; } 
                if (bases[0]) { bases[1] = true; bases[0] = false; }
                if (b === 0) { bases[0] = true; }
            }
            if (byBases === 4) { scoreThisPlay++; bases = [false, false, false]; }
            currentScore += scoreThisPlay;
            updateBsoLights();
            return scoreThisPlay;
        }

        function checkGameSet() {
            if (outs >= 3) {
                showJudgeOverlay(`🎮 チェンジ・交代！<br>最終得点: ${currentScore}点`, '#ffd700');
                balls = 0; strikes = 0; outs = 0; currentScore = 0; homerunCount = 0; strikeoutCount = 0;
                bases = [false, false, false];
                setTimeout(updateBsoLights, 2200);
            }
        }

        let isSwinging = false;
        let hasSwungThisPitch = false;
        const TOTAL_FRAMES = 90;
        const MOTION_END = 35;

        function triggerSwing() {
            if (isSwinging || !isPlaying || isHitBallActive || hitStopTimer > 0) return;
            isSwinging = true;
            hasSwungThisPitch = true;

            // Swings target closest ball coordinates
            let closestBall = null;
            let minZDist = 999.0;
            activeBalls.forEach(b => {
                const zDist = Math.abs(b.mesh.position.z - 0.45);
                if (zDist < minZDist) { minZDist = zDist; closestBall = b; }
            });

            const targetZ = closestBall ? closestBall.mesh.position.z : 0.45;
            const targetY = closestBall ? closestBall.mesh.position.y : 0.85;
            const targetX = closestBall ? closestBall.mesh.position.x : 0.0;

            batPivot.position.set(targetX * 0.6 - 0.15, targetY, targetZ - 0.45);

            gsap.to(batPivot.rotation, { 
                y: Math.PI * 1.5,
                duration: 0.11,
                ease: "power1.in",
                onComplete: () => {
                    gsap.to(batPivot.rotation, { y: 0, duration: 0.35 });
                    isSwinging = false;
                }
            });

            // Evaluate contact quality based on distance and visual overlap
            if (closestBall) {
                const flightRatio = closestBall.currentT;
                if (flightRatio >= 0.80 && flightRatio <= 1.05) {
                    isPlaying = false;
                    const ballCoord = closestBall.mesh.position;
                    const aim3D = new THREE.Vector3(meetCursor.position.x, meetCursor.position.y, ballCoord.z);
                    const dist = ballCoord.distanceTo(aim3D);

                    triggerHitImpactEffects(ballCoord);
                    clearAllBalls();

                    if (dist < 0.22) {
                        triggerHitBall(closestBall.pitchName, 115 + Math.random() * 40, true);
                    } else if (dist < 0.45) {
                        const runs = advanceRunners(1);
                        triggerHitBall(closestBall.pitchName, 60 + Math.random() * 25, false);
                        showJudgeOverlay(`🔥 ヒット！${runs > 0 ? ` +${runs}点` : ''}`, '#10b981');
                        strikes = 0; balls = 0;
                        updateBsoLights();
                    } else if (dist < 0.7) { 
                        showJudgeOverlay('💨 ファウル！', '#facc15');
                        if (strikes < 2) strikes++;
                        updateBsoLights();
                    } else {
                        showJudgeOverlay('💨 空振り！', '#ef4444');
                        strikes++;
                        if (strikes >= 3) { outs++; strikes = 0; balls = 0; strikeoutCount++; showJudgeOverlay('三振！', '#ef4444'); checkGameSet(); }
                        updateBsoLights();
                    }
                } else {
                    showJudgeOverlay('💨 空振り！(タイミング外れ)', '#ef4444');
                    strikes++;
                    if (strikes >= 3) { outs++; strikes = 0; balls = 0; strikeoutCount++; showJudgeOverlay('三振！', '#ef4444'); checkGameSet(); }
                    updateBsoLights();
                }
            }
        }

        function triggerHitImpactEffects(pos) { 
            sparkParticles.position.copy(pos);
            const posAttr = sparkParticles.geometry.attributes.position.array;
            for(let i=0; i<sparkCount; i++) {
                posAttr[i*3] = 0; posAttr[i*3+1] = 0; posAttr[i*3+2] = 0;
            }
            sparkParticles.geometry.attributes.position.needsUpdate = true;
            sparkParticles.visible = true;
            currentHitSparkTime = 0.35;
        }

        function triggerHitBall(pName, targetDist, isHomerun = true) {
            isHitBallActive = true;
            hitT = 0;
            hitStartPos = new THREE.Vector3(0, 0.85, 0.45);
            hitTrailPoints.length = 0;

            clearAllBalls();
            const activeBall = new THREE.Mesh(new THREE.SphereGeometry(0.07, 16, 16), new THREE.MeshBasicMaterial({ color: 0xffffff }));
            ballGroup.add(activeBall);
            activeBalls.push({ mesh: activeBall, pitchName: pName, points: [], currentT: 0.0 });

            const sprayAngle = (Math.random() - 0.5) * 0.8;
            activeHomerunParams = { distance: targetDist, sprayAngle, isHomerun };

            if (isHomerun) {
                homerunCount++;
                advanceRunners(4);
                strikes = 0; balls = 0;
                updateBsoLights();
                showJudgeOverlay(`🌈 ホームラン！！<br><span style='font-size:32px;'>飛距離: ${targetDist.toFixed(1)}m</span>`, '#10b981');
            }
        }

        function updateHitBallAnimation(delta) {
            if (!isHitBallActive) return;
            hitT += delta * 1.5;
            if (hitT > 1.0) hitT = 1.0;
            const p = activeHomerunParams;

            const currentZ = hitStartPos.z + (-p.distance - hitStartPos.z) * hitT;
            const currentX = hitStartPos.x + (p.distance * Math.sin(p.sprayAngle)) * hitT;
            const maxHeight = 10.0 + (p.distance * 0.15);
            const currentY = hitStartPos.y + (maxHeight - hitStartPos.y) * Math.sin(hitT * Math.PI);
            const currentPos = new THREE.Vector3(currentX, currentY, currentZ);

            if (activeBalls[0] && activeBalls[0].mesh) activeBalls[0].mesh.position.copy(currentPos);

            hitTrailPoints.push(currentPos.clone());
            if (hitTrailPoints.length > 50) hitTrailPoints.shift();
            if (hitTrailMesh) scene.remove(hitTrailMesh);
            if (hitTrailPoints.length > 1) { 
                const lineCurve = new THREE.CatmullRomCurve3(hitTrailPoints);
                hitTrailMesh = new THREE.Mesh(new THREE.TubeGeometry(lineCurve, 30, 0.05, 6, false), new THREE.MeshBasicMaterial({ color: 0xffea00 }));
                scene.add(hitTrailMesh);
            }
            if (hitT >= 1.0) { 
                isHitBallActive = false;
                clearAllBalls();
            }
        }

        container.addEventListener('mousemove', (e) => { 
            if (currentGameMode !== 'batter') return;
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(clickZone);
            if (intersects.length > 0) {
                meetCursor.position.set(intersects[0].point.x, intersects[0].point.y, 0.48);
            }
        });

        container.addEventListener('click', (e) => { 
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(clickZone);
            if (intersects.length > 0) {
                const p = intersects[0].point;
                if (currentGameMode === 'practice') {
                    userSelectedTarget.set(p.x, p.y);
                    lockOn.position.set(p.x, p.y, 0.5);
                    gsap.fromTo(lockOn.scale, {x: 1.8, y: 1.8}, {x: 1.0, y: 1.0, duration: 0.2});
                }
            }
        });

        function evaluateNoSwingResult() {
            if (currentGameMode === 'practice') return;
            if (hasSwungThisPitch) return;

            // Evaluate strike/ball results using straight pitch end-coordinate as base represent
            const repPos = calcBallCoords(activeMode === 'all' ? 'ストレート' : activeMode, TOTAL_FRAMES, userSelectedTarget).pos;
            const isStrike = (Math.abs(repPos.x) <= 0.35 && repPos.y >= 0.4 && repPos.y <= 1.3);

            if (isStrike) {
                strikes++;
                showJudgeOverlay('見逃しストライク！', '#fbbf24');
                if (strikes >= 3) { outs++; strikes = 0; balls = 0; strikeoutCount++; showJudgeOverlay('三振！', '#ef4444'); checkGameSet(); }
            } else { 
                balls++;
                showJudgeOverlay('ボール！', '#38bdf8');
                if (balls >= 4) { advanceRunners(1); strikes = 0; balls = 0; showJudgeOverlay('フォアボール！', '#10b981'); }
            }
            updateBsoLights();
        }

        function updateHologramStats() { 
            let displayPitch = (activeMode === 'all') ? 'ストレート' : activeMode;
            const pData = pitches[displayPitch];
            let devCm = Math.round(Math.abs(pData.breakX * 100));
            if (displayPitch === 'ストレート') devCm = 0;

            document.getElementById('gun-pitch-name').innerText = (activeMode === 'all') ? '全球種同時解析' : displayPitch;
            document.getElementById('gun-speed').innerText = `${pData.speed} km/h`;
            document.getElementById('gun-rpm').innerText = `SPIN: ${pData.rpm} rpm`;
            document.getElementById('gun-break').innerText = `横変化: ${devCm} cm`;

            const speedgun = document.getElementById('cyber-speedgun');
            speedgun.style.display = 'block';
            gsap.fromTo(speedgun, { opacity: 0, y: 15 }, { opacity: 1, y: 0, duration: 0.25 });
        }

        let lastTime = 0;
        function animate(timestamp) { 
            requestAnimationFrame(animate);
            controls.update();
            if (!lastTime) lastTime = timestamp;
            const delta = Math.min((timestamp - lastTime) / 1000, 0.1);
            lastTime = timestamp;

            if (isHitBallActive) updateHitBallAnimation(delta);

            if (currentHitSparkTime > 0) {
                currentHitSparkTime -= delta;
                const posAttr = sparkParticles.geometry.attributes.position.array;
                for(let i=0; i<sparkCount; i++) {
                    posAttr[i*3] += sparkVels[i].x * delta;
                    posAttr[i*3+1] += sparkVels[i].y * delta;
                    posAttr[i*3+2] += sparkVels[i].z * delta;
                }
                sparkParticles.geometry.attributes.position.needsUpdate = true;
                if (currentHitSparkTime <= 0) sparkParticles.visible = false;
            }

            if (isPlaying) { 
                const isHighlightSlowEnabled = document.getElementById('assistSlowCheck').checked;
                if (isHighlightSlowEnabled && currentFrame > MOTION_END + 15 && currentFrame < MOTION_END + 45) { 
                    currentPlaySpeed = 0.3;
                } else { 
                    currentPlaySpeed = basePlaySpeed;
                }

                currentFrame += currentPlaySpeed * 1.6;

                if (currentFrame <= TOTAL_FRAMES) { 
                    // Pitcher arm motion simulation
                    if (currentFrame < MOTION_END) { 
                        const ratio = currentFrame / MOTION_END;
                        pArm.rotation.x = -ratio * Math.PI * 1.2;
                        pArm.rotation.z = Math.sin(ratio * Math.PI) * 0.5;
                    } else { 
                        pArm.rotation.x = 0;
                        pArm.rotation.z = 0;
                    }

                    if (currentFrame >= MOTION_END) { 
                        const progress = (currentFrame - MOTION_END) / (TOTAL_FRAMES - MOTION_END);
                        const ringScale = Math.max(0.01, 1.0 - (progress * 0.95));
                        timingRing.scale.set(ringScale * 5.0, ringScale * 5.0, 1);
                        timingRing.position.set(userSelectedTarget.x, userSelectedTarget.y, 0.46);
                    } else { 
                        timingRing.scale.set(0, 0, 0);
                    }

                    // Animate each active ball according to its specific attributes
                    activeBalls.forEach((bObj) => { 
                        const calc = calcBallCoords(bObj.pitchName, currentFrame, userSelectedTarget);
                        bObj.currentT = (currentFrame < MOTION_END) ? 0.0 : calc.t;
                        bObj.mesh.position.copy(calc.pos ? calc.pos : calc);
                        bObj.mesh.rotation.x += 0.25;

                        // Build trails dynamically for visual effect
                        if (currentFrame >= MOTION_END) {
                            bObj.points.push(bObj.mesh.position.clone());
                            if (bObj.points.length > 25) bObj.points.shift();
                        }
                    });

                    // Redraw active line segments
                    activeTrails.forEach(t => scene.remove(t));
                    activeTrails.length = 0;

                    activeBalls.forEach((bObj) => {
                        if (bObj.points.length > 1) { 
                            const spec = pitches[bObj.pitchName];
                            const curve = new THREE.CatmullRomCurve3(bObj.points);
                            const trailMesh = new THREE.Mesh(
                                new THREE.TubeGeometry(curve, bObj.points.length, 0.025, 4, false),
                                new THREE.MeshBasicMaterial({ color: spec.color, transparent: true, opacity: 0.65 })
                            );
                            scene.add(trailMesh);
                            activeTrails.push(trailMesh);
                        }
                    });

                } else { 
                    isPlaying = false;
                    timingRing.scale.set(0, 0, 0);
                    evaluateNoSwingResult();
                    updateHologramStats();
                }
            }
            renderer.render(scene, camera);
        }
        requestAnimationFrame(animate);

        document.getElementById('playBtn').addEventListener('click', () => { 
            if (isPlaying || isHitBallActive) return;
            currentFrame = 0;
            isPlaying = true;
            hasSwungThisPitch = false;
            document.getElementById('cyber-speedgun').style.display = 'none';

            clearAllBalls();

            // Check pitch selection list 
            const selectedList = [];
            if (currentGameMode === 'batter') {
                const keys = Object.keys(pitches);
                const randomKey = keys[Math.floor(Math.random() * keys.length)];
                selectedList.push(randomKey);
                userSelectedTarget.set((Math.random() - 0.5) * 1.0, 0.45 + Math.random() * 0.8);
            } else {
                if (activeMode === 'all') { 
                    Object.keys(pitches).forEach(k => selectedList.push(k));
                } else {
                    selectedList.push(activeMode);
                }
            }

            // Simultaneous active ball creations
            selectedList.forEach(pName => { 
                const ballMesh = new THREE.Mesh(new THREE.SphereGeometry(0.07, 16, 16), new THREE.MeshStandardMaterial({ color: 0xfafafa, roughness: 0.3 }));
                ballGroup.add(ballMesh);
                activeBalls.push({ 
                    mesh: ballMesh, 
                    pitchName: pName, 
                    points: [], 
                    currentT: 0.0 
                });
            });
        });

        document.getElementById('swingBtn').addEventListener('click', triggerSwing);
        window.addEventListener('keydown', (e) => { 
            if (e.code === 'Space') { e.preventDefault(); triggerSwing(); }
            if (e.code === 'Enter') { e.preventDefault(); document.getElementById('playBtn').click(); }
        });

        document.getElementById('resetBtn').addEventListener('click', () => { 
            isPlaying = false; currentFrame = 0;
            document.getElementById('cyber-speedgun').style.display = 'none';
            clearAllBalls();
            if (hitTrailMesh) { scene.remove(hitTrailMesh); hitTrailMesh = null; }
        });

        const menuToggleBtn = document.getElementById('menuToggleBtn');
        const guiPopup = document.getElementById('gui-popup');
        menuToggleBtn.addEventListener('click', () => { 
            guiPopup.style.display = (guiPopup.style.display === 'block' ? 'none' : 'block');
        });

        const gmPractice = document.getElementById('gameModePractice');
        const gmBatter = document.getElementById('gameModeBatter');

        gmPractice.addEventListener('click', () => { 
            currentGameMode = 'practice';
            document.getElementById('game-mode-label').innerText = '🔍 練習モード';
            gmPractice.classList.add('btn-active'); gmBatter.classList.remove('btn-active');
            document.getElementById('pitch-selection-block').style.display = 'block';
            meetCursor.visible = false; lockOn.visible = true;
        });

        gmBatter.addEventListener('click', () => { 
            currentGameMode = 'batter';
            document.getElementById('game-mode-label').innerText = '🏏 打者対戦';
            gmBatter.classList.add('btn-active'); gmPractice.classList.remove('btn-active');
            document.getElementById('pitch-selection-block').style.display = 'none';
            meetCursor.visible = true; lockOn.visible = false;
            setCameraPreset('catcher');
        });

        // Bind menu buttons for 9 individual selections + all
        const pButtons = { 
            'all': document.getElementById('modeAll'), 
            'ストレート': document.getElementById('modeStraight'), 
            'ツーシーム': document.getElementById('modeTwoSeam'), 
            'スライダー': document.getElementById('modeSlider'),
            'カットボール': document.getElementById('modeCut'),
            'カーブ': document.getElementById('modeCurve'),
            'フォーク': document.getElementById('modeFork'),
            'チェンジアップ': document.getElementById('modeChangeup'),
            'シンカー': document.getElementById('modeSinker'),
            'シュート': document.getElementById('modeShoot')
        };
        
        Object.keys(pButtons).forEach(key => { 
            if (pButtons[key]) {
                pButtons[key].addEventListener('click', () => { 
                    activeMode = key;
                    Object.keys(pButtons).forEach(k => { 
                        if (pButtons[k]) {
                            if (k === key) pButtons[k].classList.add('btn-active'); 
                            else pButtons[k].classList.remove('btn-active');
                        }
                    });
                    document.getElementById('resetBtn').click();
                });
            }
        });

        const viewButtons = { catcher: document.getElementById('viewCatcher'), side: document.getElementById('viewSide'), back: document.getElementById('viewBack') };
        Object.keys(viewButtons).forEach(key => { 
            viewButtons[key].addEventListener('click', () => { 
                setCameraPreset(key);
                Object.keys(viewButtons).forEach(k => { 
                    if (k === key) viewButtons[k].classList.add('btn-active'); 
                    else viewButtons[k].classList.remove('btn-active');
                });
            });
        });

        window.addEventListener('resize', () => { 
            camera.aspect = container.clientWidth / 600; camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, 600);
        });

        updateBsoLights();
    </script>
</body>
</html>
